name: CI

on:
  push:
    branches: [master]
  pull_request:

# Un nouveau push annule le lancement précédent de la même branche : pas de calcul inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Le minimum : la CI lit le code, elle n'écrit rien dans le repo.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests unitaires et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (dont les règles d'accessibilité des templates)
        run: npx ng lint

      - name: Tests unitaires
        run: npx ng test --no-watch

      - name: Build de production
        run: npx ng build

  e2e:
    name: Tests de bout en bout et accessibilité (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests Playwright (ordinateur et mobile, fr / en / es)
        run: npm run e2e

      # Le rapport HTML, avec les traces des échecs et les résultats d'axe, téléchargeable depuis l'onglet Actions.
      - name: Publier le rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14